name: Scrape Metrics and Update Telegram

on:
  schedule:
    # Runs every hour. Adjust this CRON schedule as needed.
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual execution from the GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure Playwright Browsers are Installed
      run: |
        # Refresh the package lists first to prevent installation candidate errors
        sudo apt-get update
        python -m playwright install chromium --with-deps

    - name: Run Telegram Bot Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python bot.py
